# Party Tracker Stage Metadata

# The name of the stage.
project_name: "Party Tracker"

# A short tagline to show in search.
tagline: "Flexible character and party management for TTRPG roleplay."

# 'PUBLIC', 'PRIVATE', or 'UNLISTED'.
visibility: 'PUBLIC'

# 'ADJACENT' | 'NONE' | 'COVER' | 'FULLSCREEN'
# ADJACENT displays on the side of chat (desktop) or top (mobile)
position: 'ADJACENT'

# Tags for discovery
tags:
  - 'TTRPG'
  - 'Character'
  - 'Party'
  - 'Stats'
  - 'Tracker'
  - 'RPG'

# Config schema (currently unused, but required)
config_schema:
  type: object
  properties: {}

# State schema - we use message state for party data
state_schema:
  message:
    type: object
    properties:
      members:
        type: array
        items:
          type: object

# Whether to publish anonymously
is_anonymous: false

# Disable ratings
ratings_disabled: false

# extension_id and github_path will be auto-generated on first push

github_path: 'https://github.com/BHIVE-des/chub-Party-Tracker'

